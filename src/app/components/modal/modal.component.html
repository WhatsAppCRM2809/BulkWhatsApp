<div class="modal-overlay" *ngIf="options" (click)="onClose()">
  <div class="modal-card" (click)="$event.stopPropagation()">

    <!-- Header Icon -->
    <div class="modal-icon-container" [ngClass]="options.type || 'warning'">
      <!-- Warning / Security Icon -->
      <svg *ngIf="options.type === 'warning' || !options.type" class="modal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>

      <!-- Error Icon -->
      <svg *ngIf="options.type === 'error'" class="modal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
      </svg>

      <!-- Success Icon -->
      <svg *ngIf="options.type === 'success'" class="modal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>

      <!-- Info Icon -->
      <svg *ngIf="options.type === 'info'" class="modal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
    </div>

    <!-- Content -->
    <h3 class="modal-title">{{ options.title }}</h3>
    <p class="modal-message">{{ options.message }}</p>

    <!-- Footer Action -->
    <div class="modal-actions">
      <button class="btn-confirm" (click)="onClose()">
        {{ options.confirmText || 'Entendido' }}
      </button>
    </div>

  </div>
</div>
