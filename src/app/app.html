<!-- Global Modal Popup Component -->
<app-modal></app-modal>

<!-- Fullscreen Login View without Sidebar & Header -->
<ng-container *ngIf="isLoginPage()">
  <router-outlet></router-outlet>
</ng-container>

<!-- Dashboard Main Layout with Sidebar & Header -->
<div class="app-container" *ngIf="!isLoginPage()">
  <!-- Sidebar Navigation -->
  <app-sidebar></app-sidebar>

  <!-- Main Content Area -->
  <main class="main-content">
    <!-- Header with Theme Toggle & Upload -->
    <app-header></app-header>

    <!-- Dynamic Router Outlet Page View -->
    <div class="page-body">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
